# Production config for the PCA-specific PSD study (SDXL-Turbo), first pass.
#
# `run`/`model`/`generation` reuse noise_init/configs/sdxl_turbo_full.yaml's
# values by value (not by reference -- this package never reads that file at
# runtime, see pc_specific_psd/docs/IMPLEMENTATION_DECISIONS.md). Source file
# sha256 at the time of copying:
#   99880bda712dc331e3dfe4ad117dfe6fcc00377dd54f4eb53636efb6704d6b50
#
# `basis.dataset_manifest_path` is deliberately left unset: this pass does not
# have a local image dataset, so real basis construction is NOT_RUN until a
# dataset manifest path is supplied (see IMPLEMENTATION_REPORT.md). Every
# `psd.*` field is a finite, pre-declared candidate set per plan section 5.4 --
# `calibrate` selects from these candidates and freezes its selection into
# `psd.calibration_result_path`; nothing here is a measured/tuned value yet.
# `psd.groups` declares all six PC groups (manifests.PC_GROUPS) up front,
# since which 1-2 groups become real candidates is only known after probing
# and human annotation (deferred to the GPU machine) -- see
# IMPLEMENTATION_DECISIONS.md for why the config does not wait for that
# result before being considered "complete".

run:
  name: sdxl_turbo_pca_v1
  master_seed: 20260825
  outputs_root: ../outputs

model:
  adapter: sdxl_turbo
  checkpoint: stabilityai/sdxl-turbo
  vae_checkpoint: madebyollin/sdxl-vae-fp16-fix
  revision: null
  dtype: float16
  device: cuda
  cpu_offload: false
  cache_dir: cache

generation:
  height: 512
  width: 512
  num_inference_steps: 1
  guidance_scale: 0.0
  generation_batch_size: 1
  output_format: png
  release_model_after_generation: true

basis:
  patch_size: 5
  channels: 4
  patches_per_image: 64
  sampling_seed: 20260826
  split_seed: 20260827
  basis_output_path: ../basis/sdxl_turbo_pca_v1_basis.pt
  num_leading_components: 32
  dataset_manifest_path: /workspace/Initial_Noise_Optimization/pc_specific_psd/manifests/coco_train2017_2000_seed20260829.json

probing:
  rho: 0.10

psd:
  protocol: operator_clean
  num_bins: 32
  psd_tolerance: 0.05
  correction_gain_bound: 4.0
  condition_number_threshold: 50.0
  calibration_bank_size: 256
  validation_bank_size: 128
  calibration_bank_seed: 20260830
  validation_bank_seed: 20260831
  gate_candidates:
    - {r_s: 4.0, beta: 2.0}
    - {r_s: 8.0, beta: 2.0}
    - {r_s: 8.0, beta: 4.0}
  groups:
    - {group_id: B1, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
    - {group_id: B2, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
    - {group_id: B3, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
    - {group_id: B4, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
    - {group_id: B5, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
    - {group_id: B6, tau_plus_candidates: [0.5, 1.0, 2.0], tau_minus_candidates: [-0.5, -1.0, -2.0], target_rms: 1.0}
  calibration_result_path: ../calibration/sdxl_turbo_pca_v1_calibration_result.json